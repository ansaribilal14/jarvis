name: release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses + install NDK/CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ndk.dir=$ANDROID_HOME/ndk/27.0.12077973" >> local.properties

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jarvis-release.jks"
          echo "JARVIS_KS_FILE=$RUNNER_TEMP/jarvis-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          JARVIS_KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          JARVIS_KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare artifacts (APK + SHA-256)
        run: |
          cp app/build/outputs/apk/release/*.apk jarvis-release.apk
          sha256sum jarvis-release.apk > jarvis-release.apk.sha256
          echo "### JARVIS ${{ github.ref_name }}" > release-notes.md
          echo "- arm64-v8a · minSdk 29 (Android 10+) · signed release" >> release-notes.md
          cat jarvis-release.apk.sha256 >> release-notes.md

      - name: Upload APK to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" jarvis-release.apk jarvis-release.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload workflow artifact (manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: |
            jarvis-release.apk
            jarvis-release.apk.sha256

      - name: Send APK to Telegram
        if: always()
        continue-on-error: true
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            LINK="${{ github.event.release.html_url }}"
          else
            LINK="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          CAPTION="🤖 JARVIS release APK ready
          arm64-v8a · Android 10+ · signed
          SHA-256 in the .sha256 file
          ${LINK}"
          curl -s -X POST "https://api.telegram.org/bot${BOT}/sendDocument" \
            -F chat_id="${CHAT}" \
            -F document=@"jarvis-release.apk" \
            -F caption="${CAPTION}" || true
